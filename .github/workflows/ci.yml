name: CI

on:
  push:
    branches:
      - 'main'
  pull_request: {}

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Test Go ${{ matrix.go }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go:
          - 'stable'
          - 'oldstable'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ matrix.go }}
          # The workload identity provider modules have their own go.sum.
          cache-dependency-path: '**/go.sum'

      # Builds, vets and tests the SDK, then vets and tests each workload
      # identity provider module, which ./... at the root does not enter.
      - name: Build, vet and test
        run: ./script/ci
