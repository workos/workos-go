# Nested-module tagging is unrehearsed; see release-checklist.md.
name: Release Please

on:
  push:
    branches:
      - main
  # Manual fallback. Tags any merged-but-untagged release PR, then lets
  # release-please open the next release PR. Use it if a push to main
  # ever fails to trigger this workflow.
  workflow_dispatch:

concurrency:
  group: release-please
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    needs: publish-release
    if: needs.publish-release.outputs.is-release != 'true'
    runs-on: ubuntu-latest
    outputs:
      pr: ${{ steps.release.outputs.pr }}
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.SDK_BOT_APP_ID }}
          private-key: ${{ secrets.SDK_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      # skip-github-release means release-please opens/updates release
      # PRs and updates CHANGELOG.md as usual, but does NOT tag or create
      # the GitHub Release on merge. Those are owned by publish-release
      # below so we can set the Release body from the rich CHANGELOG.md
      # section instead of release-please's terse default rendering.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          skip-github-release: true

      # With separate-pull-requests, one run can open or update several
      # release PRs: one for the SDK (package ".") and one for each nested
      # module under workloadidentity/. The steps below rewrite the SDK's
      # module path and the SDK's CHANGELOG.md, so they run only for the
      # SDK's release PR. Its branch is the one release branch that names no
      # component.
      - name: Find the SDK release PR
        id: sdk-pr
        if: steps.release.outputs.prs
        env:
          PRS_JSON: ${{ steps.release.outputs.prs }}
        run: |
          set -euo pipefail
          HEAD_BRANCH=$(jq -r '[ .[] | .headBranchName | select(contains("--components--") | not) ] | first // ""' <<<"$PRS_JSON")
          if [ -n "$HEAD_BRANCH" ]; then
            echo "SDK release PR branch: $HEAD_BRANCH"
          else
            echo "No SDK release PR in this run; only nested-module release PRs changed."
          fi
          echo "head-branch=$HEAD_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Checkout the SDK release PR branch
        if: steps.sdk-pr.outputs.head-branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ steps.sdk-pr.outputs.head-branch }}
          token: ${{ steps.app-token.outputs.token }}

      # Go modules require the module path and all import statements to
      # include the major version (e.g. /v7). release-please doesn't handle
      # this, so when a release PR bumps the major version we automatically
      # rewrite go.mod, imports, and READMEs on the release PR branch.
      # The nested modules under workloadidentity/ version on their own and
      # their paths carry no SDK major version, so they are left alone.
      - name: Migrate Go module path for major version bump
        if: steps.sdk-pr.outputs.head-branch
        run: |
          CURRENT_MAJOR=$(grep -oP 'module github\.com/workos/workos-go/v\K[0-9]+' go.mod)
          NEW_VERSION=$(jq -r '."."' .release-please-manifest.json)
          NEW_MAJOR="${NEW_VERSION%%.*}"

          if [ "$CURRENT_MAJOR" = "$NEW_MAJOR" ]; then
            echo "No major version change ($CURRENT_MAJOR → $NEW_MAJOR), skipping"
            exit 0
          fi

          echo "Major version bump detected: v$CURRENT_MAJOR → v$NEW_MAJOR"

          sed -i "s|module github.com/workos/workos-go/v${CURRENT_MAJOR}|module github.com/workos/workos-go/v${NEW_MAJOR}|" go.mod
          find . -name '*.go' -not -path './.git/*' -not -path './workloadidentity/*' -type f \
            -exec sed -i "s|github.com/workos/workos-go/v${CURRENT_MAJOR}|github.com/workos/workos-go/v${NEW_MAJOR}|g" {} +
          find . -name 'README.md' -not -path './.git/*' -not -path './workloadidentity/*' -type f \
            -exec sed -i "s|workos-go/v${CURRENT_MAJOR}|workos-go/v${NEW_MAJOR}|g" {} +

          git config user.name "workos-sdk-automation[bot]"
          git config user.email "255426317+workos-sdk-automation[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update go.mod and import paths for v${NEW_MAJOR}"
            git push
          fi

      # Inline pending changelog fragments under the version heading
      # release-please just wrote in CHANGELOG.md. For PRs that have a
      # fragment (the autogen flow always writes one), drop the line
      # release-please rendered and use the fragment instead. For PRs
      # without a fragment (typical for human-authored PRs), keep what
      # release-please wrote. Fragments are deleted in the same commit.
      # Idempotent: if no fragments exist, skip silently.
      # Fragments describe the SDK, so a nested module's release PR skips
      # this, and the version is the root package's in the manifest.
      - name: Inline rich changelog fragments
        if: steps.sdk-pr.outputs.head-branch
        run: |
          set -euo pipefail
          shopt -s nullglob
          fragments=(.changelog-pending/*.md)
          if [ ${#fragments[@]} -eq 0 ]; then
            echo "No .changelog-pending fragments; leaving release-please CHANGELOG.md as-is."
            exit 0
          fi

          VERSION=$(jq -r '."."' .release-please-manifest.json)
          export VERSION

          python3 - <<'PY'
          import os, re, pathlib, glob

          version = os.environ["VERSION"]

          # Load fragments + extract the PR number each one covers from
          # its top-line "* [#NN](url) ...".
          fragments = []
          covered = set()
          for path in sorted(glob.glob(".changelog-pending/*.md")):
              body = pathlib.Path(path).read_text().rstrip()
              m = re.search(r'\[#(\d+)\]', body)
              if m:
                  covered.add(m.group(1))
              fragments.append(body)

          changelog = pathlib.Path("CHANGELOG.md")
          text = changelog.read_text()
          section_re = re.compile(
              r'(^## \[' + re.escape(version) + r'\][^\n]*\n)(.*?)(?=^## |\Z)',
              re.MULTILINE | re.DOTALL,
          )
          match = section_re.search(text)
          if not match:
              raise SystemExit(f"Could not find '## [{version}]' heading in CHANGELOG.md")
          heading, body = match.group(1), match.group(2)

          # Drop any release-please line that references a PR we have a
          # fragment for.
          kept = []
          for line in body.split("\n"):
              if any(pr in covered for pr in re.findall(r'\[#(\d+)\]', line)):
                  continue
              kept.append(line)
          filtered = "\n".join(kept)

          # Collapse "### Heading\n(blank lines)\n" with nothing under
          # it. Run repeatedly until stable in case of stacked empties.
          empty_section = re.compile(
              r'^### [^\n]*\n(?:\s*\n)*(?=^### |\Z)',
              re.MULTILINE,
          )
          while True:
              new = empty_section.sub('', filtered)
              if new == filtered:
                  break
              filtered = new
          filtered = filtered.strip()

          parts = []
          if filtered:
              parts.append(filtered)
          parts.extend(fragments)
          new_body = "\n\n".join(parts)

          new_text = text[:match.start()] + heading + "\n" + new_body + "\n\n" + text[match.end():]
          changelog.write_text(new_text)
          PY

          git config user.name "workos-sdk-automation[bot]"
          git config user.email "255426317+workos-sdk-automation[bot]@users.noreply.github.com"
          git rm .changelog-pending/*.md
          git add CHANGELOG.md
          git commit -m "chore: inline release notes from .changelog-pending"
          git push

  # Tag and create the GitHub Release for every merged release PR that
  # release-please still labels "autorelease: pending". The Release body
  # is the rich CHANGELOG.md section (after the inline step above) as of
  # the merge commit.
  #
  # Each package has its own release PR, tag and changelog:
  #   the SDK (package ".")      chore(main): release X.Y.Z              vX.Y.Z              CHANGELOG.md
  #   a nested module at <path>  chore(main): release <path> X.Y.Z       <path>/vX.Y.Z       <path>/CHANGELOG.md
  # A nested module is its own Go module, and Go resolves it only from a
  # tag prefixed with its directory. Tagging one "vX.Y.Z" would release
  # the SDK instead, so the package comes from the PR title and is checked
  # against release-please-config.json before anything is tagged.
  #
  # This runs on every push to main and on manual dispatch, and it is
  # idempotent: it looks at merged PRs, not at the commit that triggered
  # the run. So if the run for a release merge is ever lost (GitHub
  # dropped the push event for the 10.4.0 merge on 2026-09-01), the next
  # run heals it instead of leaving release-please aborting forever with
  # "untagged, merged release PRs outstanding".
  publish-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      is-release: ${{ steps.publish.outputs.is-release }}
      version: ${{ steps.publish.outputs.version }}
    steps:
      - name: Generate token
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.SDK_BOT_APP_ID }}
          private-key: ${{ secrets.SDK_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          token: ${{ steps.generate-token.outputs.token }}

      - name: Find merged release PRs awaiting a tag
        id: pending
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          set -euo pipefail
          # release-please's default release PR titles:
          #   chore(main): release X.Y.Z               the SDK
          #   chore(main): release <component> X.Y.Z   a nested module
          # A nested module's component is its path. Titles that match
          # neither form are not release PRs and are left alone.
          gh pr list --state merged --base main --label "autorelease: pending" \
            --json number,title,mergeCommit \
            --jq '[ .[]
                    | { number, sha: .mergeCommit.oid }
                      + ( .title
                          | capture("^chore\\([^)]*\\): release( (?<component>[^ ]+))? (?<version>[0-9]+\\.[0-9]+\\.[0-9]+)$")
                          | { version, package: (.component // ".") } ) ]
                  | sort_by(.package, (.version | split(".") | map(tonumber)))' \
            > /tmp/pending.json
          COUNT=$(jq length /tmp/pending.json)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          if [ "$COUNT" -eq 0 ]; then
            echo "No merged release PRs awaiting a tag."
          else
            jq -r '.[] | "PR #\(.number): package \(.package) \(.version) at \(.sha)"' /tmp/pending.json
          fi

      - name: Tag, create GitHub Release, and mark PR as tagged
        id: publish
        if: steps.pending.outputs.count != '0'
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          set -euo pipefail
          git config user.name "workos-sdk-automation[bot]"
          git config user.email "255426317+workos-sdk-automation[bot]@users.noreply.github.com"

          while IFS=$'\t' read -r NUMBER SHA VERSION PACKAGE; do
            if [ "$PACKAGE" = "." ]; then
              TAG="v$VERSION"
              CHANGELOG="CHANGELOG.md"
            else
              TAG="$PACKAGE/v$VERSION"
              CHANGELOG="$PACKAGE/CHANGELOG.md"
            fi
            echo "::group::Publishing $TAG from PR #$NUMBER ($SHA)"

            # Never tag for a package release-please does not manage, or for
            # a nested path that is not a Go module.
            if ! git show "$SHA:release-please-config.json" | jq -e --arg p "$PACKAGE" '.packages[$p]' >/dev/null; then
              echo "::error::PR #$NUMBER releases \"$PACKAGE\", which is not a package in release-please-config.json at $SHA"
              exit 1
            fi
            if [ "$PACKAGE" != "." ] && ! git cat-file -e "$SHA:$PACKAGE/go.mod" 2>/dev/null; then
              echo "::error::PR #$NUMBER releases \"$PACKAGE\", which has no go.mod at $SHA"
              exit 1
            fi

            # Read the changelog as of the merge commit so that healing an
            # older release still gets that release's notes. The heading is
            # "## [X.Y.Z](compare link) (date)", or "## X.Y.Z (date)" for a
            # package's first release, which has no earlier tag to compare
            # with. awk reads to the end of the file so git never writes to
            # a closed pipe.
            git show "$SHA:$CHANGELOG" | awk -v v="$VERSION" '
              state == 0 && (index($0, "## [" v "]") == 1 || index($0, "## " v " ") == 1 || $0 == "## " v) { state = 1; next }
              state == 1 && index($0, "## ") == 1 { state = 2 }
              state == 1
            ' > /tmp/release-notes.md
            if [ ! -s /tmp/release-notes.md ]; then
              echo "::error::$CHANGELOG at $SHA has no body for $TAG"
              exit 1
            fi

            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
              echo "Tag $TAG already exists; skipping tag."
            else
              git tag -a "$TAG" "$SHA" -m "Release $TAG"
              git push origin "$TAG"
            fi

            # Only an SDK release may become the repository's "Latest"
            # release; a nested module's must not displace it.
            LATEST=()
            if [ "$PACKAGE" != "." ]; then
              LATEST=(--latest=false)
            fi
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "Release $TAG already exists; skipping release."
            else
              gh release create "$TAG" \
                --title "$TAG" \
                --target "$SHA" \
                --notes-file /tmp/release-notes.md \
                "${LATEST[@]}"
            fi

            gh pr edit "$NUMBER" \
              --remove-label "autorelease: pending" \
              --add-label "autorelease: tagged"

            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "::endgroup::"
          done < <(jq -r '.[] | [.number, .sha, .version, .package] | @tsv' /tmp/pending.json)

          echo "is-release=true" >> "$GITHUB_OUTPUT"
